name: Build LeafSDTools and release new version

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Windows amd64
        run: |
          fyne-cross windows -app-id com.developerfromjokela.leafsdtools.companion -arch=amd64 -output=dist
          mv fyne-cross/dist/windows-amd64/*.zip fyne-cross/dist/LeafSDTools-Companion-windows-amd64.zip || true
          sha256sum fyne-cross/dist/LeafSDTools-Companion-windows-amd64.zip > fyne-cross/dist/LeafSDTools-Companion-windows-amd64.zip.sha256
          
      - name: Upload Windows Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fyne-cross/dist/LeafSDTools-Companion-windows-amd64.zip
            fyne-cross/dist/LeafSDTools-Companion-windows-amd64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          
      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install Linux dependencies for fyne package
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libwayland-dev libxkbcommon-dev libgles2-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libdbus-1-dev libgtk-3-dev libasound2-dev libpulse-dev

      - name: Build & Package Linux
        run: |
          fyne package \
            -os linux \
            --name "leafsdtools-companion" \
            -icon ./Icon.png \
            --release

          TAR_FILE=leafsdtools-companion.tar.xz
          if [ -z "$TAR_FILE" ]; then
            echo "Error: No .tar.gz found after fyne package"
            ls -la
            exit 1
          fi

          mv "$TAR_FILE" LeafSDTools-Companion-linux-amd64.tar.xz
          sha256sum LeafSDTools-Companion-linux-amd64.tar.xz > LeafSDTools-Companion-linux-amd64.tar.xz.sha256

      - name: Upload Linux Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LeafSDTools-Companion-linux-amd64.tar.xz
            LeafSDTools-Companion-linux-amd64.tar.xz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build & Package macOS universal .app
        run: |
          fyne package \
            -os darwin \
            --name "LeafSDTools Companion" \
            --release

          APP_NAME="LeafSDTools Companion.app"

          if [ -d "$APP_NAME" ]; then
            zip -r -9 LeafSDTools-Companion-macos-universal.zip "$APP_NAME"
            sha256sum LeafSDTools-Companion-macos-universal.zip > LeafSDTools-Companion-macos-universal.zip.sha256
          else
            echo "Error: .app bundle not found. Check fyne package output name."
            ls -la
            exit 1
          fi

      - name: Upload macOS Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LeafSDTools-Companion-macos-universal.zip
            LeafSDTools-Companion-macos-universal.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
