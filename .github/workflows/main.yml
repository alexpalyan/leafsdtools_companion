name: Build LeafSDTools and release new version

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Windows amd64
        run: |
          fyne-cross windows -app-id com.developerfromjokela.leafsdtools.companion -arch=amd64 -output=dist
          mv dist/windows-amd64/*.zip dist/LeafSDTools-Companion-windows-amd64.zip || true
          sha256sum dist/LeafSDTools-Companion-windows-amd64.zip > dist/LeafSDTools-Companion-windows-amd64.zip.sha256

      - name: Build Linux amd64
        run: |
          fyne-cross linux -app-id com.developerfromjokela.leafsdtools.companion -arch=amd64 -output=dist
          mv dist/linux-amd64/*.tar.gz dist/LeafSDTools-Companion-linux-amd64.tar.gz || true
          sha256sum dist/LeafSDTools-Companion-linux-amd64.tar.gz > dist/LeafSDTools-Companion-linux-amd64.tar.gz.sha256

      - name: Upload Linux/Windows Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LeafSDTools-Companion-windows-amd64.zip
            dist/LeafSDTools-Companion-windows-amd64.zip.sha256
            dist/LeafSDTools-Companion-linux-amd64.tar.gz
            dist/LeafSDTools-Companion-linux-amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up docker
        uses: docker/setup-docker-action@v4.7.0

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build macOS universal
        run: |
          fyne-cross darwin -app-id com.developerfromjokela.leafsdtools.companion -arch=amd64,arm64 -output=dist
          mv dist/darwin-universal/*.zip LeafSDTools-Companion-macos-universal.zip || true
          sha256sum LeafSDTools-Companion-macos-universal.zip > LeafSDTools-Companion-macos-universal.zip.sha256

      - name: Upload macOS Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LeafSDTools-Companion-macos-universal.zip
            LeafSDTools-Companion-macos-universal.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
