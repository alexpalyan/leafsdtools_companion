name: Build LeafSDTools and release new version

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Download macOS Command Line Tools DMG
        run: |
          curl -L -o cltools.dmg https://github.com/fyne-io/fyne-cross/raw/main/internal/tool/darwin/sdk/Command_Line_Tools_for_Xcode_13.2.dmg

      - name: Extract macOS SDK
        run: |
          mkdir -p sdk
          fyne-cross darwin-sdk-extract --xcode-path cltools.dmg --output sdk
          ls -la sdk  # should show MacOSX*.sdk

      - name: Build Windows amd64
        run: |
          fyne-cross windows -arch=amd64 -output=dist
          mv dist/windows-amd64/*.zip dist/LeafSDTools-Companion-windows-amd64.zip 2>/dev/null || true
          sha256sum dist/LeafSDTools-Companion-windows-amd64.zip | tee dist/LeafSDTools-Companion-windows-amd64.zip.sha256


      - name: Build macOS universal
        env:
          SDK_PATH: ${{ github.workspace }}/sdk/MacOSX*.sdk
        run: |
          fyne-cross darwin -arch=amd64,arm64 \
            --macosx-sdk-path "$SDK_PATH" \
            -output=dist
          mv dist/darwin-universal/*.zip dist/LeafSDTools-Companion-macos-universal.zip 2>/dev/null || true
          sha256sum dist/LeafSDTools-Companion-macos-universal.zip | tee dist/LeafSDTools-Companion-macos-universal.zip.sha256

      - name: Build Linux amd64
        run: |
          fyne-cross linux -arch=amd64 -output=dist
          mv dist/linux-amd64/*.tar.gz dist/LeafSDTools-Companion-linux-amd64.tar.gz 2>/dev/null || true
          sha256sum dist/LeafSDTools-Companion-linux-amd64.tar.gz | tee dist/LeafSDTools-Companion-linux-amd64.tar.gz.sha256

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LeafSDTools-Companion-windows-amd64.zip
            dist/LeafSDTools-Companion-windows-amd64.zip.sha256
            dist/LeafSDTools-Companion-macos-universal.zip
            dist/LeafSDTools-Companion-macos-universal.zip.sha256
            dist/LeafSDTools-Companion-linux-amd64.tar.gz
            dist/LeafSDTools-Companion-linux-amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
